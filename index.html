<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to GitHub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: #f6f8fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #24292f;
        }
        .login-container {
            background: white;
            padding: 24px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            width: 100%;
            max-width: 375px;
            box-shadow: 0 8px 24px rgba(140,147,158,0.2);
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            width: 75px;
            height: 75px;
        }
        h2 {
            font-size: 24px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 5px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #f6f8fa;
        }
        input:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(3, 102, 144, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 6px 16px;
            background-color: #238636;
            color: white;
            border: 1px solid rgba(60,66,78,0.15);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #2ea043;
        }
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
        }
        .footer-links a {
            color: #0969da;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://github.com/favicon.ico" alt="GitHub Logo">
        </div>
        <h2>Sign in to GitHub
