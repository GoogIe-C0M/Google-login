<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { width: 450px; border: 1px solid #dadce0; border-radius: 8px; padding: 48px 40px 36px; text-align: center; }
        .logo { font-size: 24px; font-weight: 500; margin-bottom: 10px; color: #757575; }
        .title { font-size: 24px; font-weight: 400; margin-bottom: 10px; color: #202124; }
        .subtitle { font-size: 16px; font-weight: 400; color: #202124; margin-bottom: 40px; }
        .input-group { position: relative; margin-bottom: 30px; text-align: left; }
        input { width: 100%; padding: 13px 15px; font-size: 14px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; outline: none; transition: border 0.2s; }
        input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }
        .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
        .link { color: #1a73e8; text-decoration: none; font-weight: 500; font-size: 14px; cursor: pointer; }
        .btn-primary { background-color: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 500; cursor: pointer; font-size: 14px; }
        .btn-primary:hover { background-color: #174ea6; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">Google</div>
        <div class="title">Sign in</div>
        <div class="subtitle">Use your Google Account</div>
        
        <form action="password.html" method="GET">
            <div class="input-group">
                <input type="text" name="email" placeholder="Email or phone" required>
            </div>
            <div class="footer">
                <a href="#" class="link">Forgot email?</a>
                <button type="submit" class="btn-primary">Next</button>
            </div>
        </form>
    </div>
</body>
</html>
